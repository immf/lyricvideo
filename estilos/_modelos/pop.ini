# Modelo do estilo 'pop' - Pop colorido (feliz)
# Para criar um estilo seu: copie este arquivo para a pasta estilos\ com outro nome
# (ex.: estilos\pop-meu.ini), mude o 'nome' e os valores que quiser.
# Linhas que voce apagar (ou deixar vazias) usam o padrao do estilo base.
# Cores: #RRGGBB. Depois clique no botao de recarregar estilos na interface.

nome = Pop colorido (feliz) (meu)
base = pop

# espessura do contorno (px em 720p)
contorno = 10
# cor do contorno das letras
cor_contorno = #FFFFFF
# familia da fonte (qualquer uma da lista Fonte da interface)
fonte = Arial
# granulado de filme 0-0.2
granulado = 0.03
# quanto a musica mexe na animacao (1 = padrao)
intensidade = 1
# 1 = tudo em maiusculas, 0 = como na letra
maiusculas = 0
# matiz base 0-360 (estilos que derivam as cores de um matiz)
matiz = 320
# altura do centro do texto (0 = topo, 1 = base)
posicao_y = 0.5
# multiplicador do tamanho do texto (1 = padrao)
tamanho = 1
# escurecimento das bordas 0-1
vinheta = 0.12

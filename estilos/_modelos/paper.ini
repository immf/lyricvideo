# Modelo do estilo 'paper' - Papel recortado (stop-motion)
# Para criar um estilo seu: copie este arquivo para a pasta estilos\ com outro nome
# (ex.: estilos\paper-meu.ini), mude o 'nome' e os valores que quiser.
# Linhas que voce apagar (ou deixar vazias) usam o padrao do estilo base.
# Cores: #RRGGBB. Depois clique no botao de recarregar estilos na interface.

nome = Papel recortado (stop-motion) (meu)
base = paper

# cor das palavras em *enfase*
cor_destaque = #B3261E
# cor do papel
cor_papel = #F0E8D6
# cor principal das letras (#RRGGBB)
cor_texto = #1E1A16
# familia da fonte (qualquer uma da lista Fonte da interface)
fonte = Arial
# cor de fundo
fundo = #BA4B38
# granulado de filme 0-0.2
granulado = 0.055
# quanto a musica mexe na animacao (1 = padrao)
intensidade = 1
# 1 = tudo em maiusculas, 0 = como na letra
maiusculas = 1
# matiz base 0-360 (estilos que derivam as cores de um matiz)
matiz = 9
# faixa de altura onde as tiras podem cair (fim)
posicao_y_max = 0.5
# faixa de altura onde as tiras podem cair (inicio)
posicao_y_min = 0.2
# multiplicador do tamanho do texto (1 = padrao)
tamanho = 1
# escurecimento das bordas 0-1
vinheta = 0.32
